version: '3.8'

services:
  backend:
    build: .
    container_name: presentation_con
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    networks:
      - app_network

  nginx_server:
    image: nginx:alpine
    container_name: global_nginx
    ports:
      - "80:80"
    volumes:
      - ./templates:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/usr/share/nginx/media:ro
    networks:
      - app_network
    depends_on:
      - backend

networks:
  app_network:
    driver: bridge

volumes:
  media_volume:
