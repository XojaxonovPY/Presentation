version: '3.8'

services:
  nginx_server:
    image: nginx:alpine
    container_name: global_nginx
    ports:
      - "80:80"
    volumes:
      - ./templates:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - backend

  backend:
    build: .
    container_name: presentation_con
    networks:
      - app_network # Shunda Nginx uni ko'ra oladi
    ports:
      - "8000:8000"

networks:
  app_network:
    driver: bridge